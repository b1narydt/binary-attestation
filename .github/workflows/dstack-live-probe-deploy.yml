name: Deploy dstack live probe

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dstack-live-probe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned Phala Cloud CLI
        run: npm install --global phala@1.1.19
      - name: Verify private image access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker buildx imagetools inspect \
            ghcr.io/b1narydt/bcap1-dstack-probe@sha256:3a73dffe4bd8d344ffa54d451f7889066ea3a504ddf8e60296520cc8b63603be
      - name: Deploy production dstack probe
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$PHALA_CLOUD_API_KEY"
          test -n "$GHCR_TOKEN"
          phala deploy \
            --name bcap1-dstack-probe \
            --compose deploy/dstack-live-probe/docker-compose.yml \
            --instance-type tdx.small \
            --node-id 18 \
            --image dstack-0.5.9 \
            --no-dev-os \
            --wait \
            --json \
            -e "DSTACK_DOCKER_USERNAME=${{ github.actor }}" \
            -e "DSTACK_DOCKER_PASSWORD=$GHCR_TOKEN" \
            -e DSTACK_DOCKER_REGISTRY=ghcr.io

          for attempt in $(seq 1 60); do
            cvm_json=$(phala cvms get bcap1-dstack-probe --json)
            cvm_status=$(printf '%s' "$cvm_json" | jq -r '.status')
            instance_id=$(printf '%s' "$cvm_json" | jq -r '.instance_id // empty')
            echo "attempt=$attempt status=$cvm_status instance=${instance_id:-pending}"

            if [[ "$cvm_status" == "running" && -n "$instance_id" ]]; then
              endpoint=$(printf '%s' "$cvm_json" | jq -er '.endpoints[0].app')
              curl --fail --silent --show-error --retry 12 --retry-delay 5 "$endpoint/health"
              printf '%s' "$cvm_json" | jq '{id,name,app_id,vm_uuid,instance_id,status,compose_hash,os,node_info,endpoints,services}'
              exit 0
            fi

            if [[ "$cvm_status" == "error" || "$cvm_status" == "failed" ]]; then
              phala cvms serial-logs bcap1-dstack-probe --tail 160 || true
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for the dstack probe" >&2
          phala cvms serial-logs bcap1-dstack-probe --tail 160 || true
          exit 1

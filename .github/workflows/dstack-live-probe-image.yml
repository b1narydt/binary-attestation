name: Publish dstack live probe image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/b1narydt/bcap1-dstack-probe:20261005

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the production probe
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file deploy/dstack-live-probe/Dockerfile \
            --tag "$IMAGE" \
            --provenance=false \
            --push \
            .
      - name: Resolve immutable registry digest
        run: |
          manifest_digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -er .digest)
          echo "IMAGE_DIGEST=$manifest_digest" | tee -a "$GITHUB_ENV"
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@$manifest_digest" >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"

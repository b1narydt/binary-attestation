name: Publish dstack live probe image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/b1narydt/bcap1-dstack-probe:20261005
  TTL_IMAGE: ttl.sh/bcap1-dstack-probe-4295779-01a10f43:24h

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the production probe
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file deploy/dstack-live-probe/Dockerfile \
            --tag "$IMAGE" \
            --tag "$TTL_IMAGE" \
            --provenance=false \
            --push \
            .

[workspace]
members = ["rust/core", "rust/providers/dstack"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/b1narydt/binary-attestation"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = { version = "1", default-features = false }
base64 = "0.22"
binary-attestation-core = { path = "rust/core" }
chrono = { version = "0.4", default-features = false }
dcap-qvl = { version = "=0.5.2", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
der = { version = "0.7", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
sha3 = { version = "0.10", default-features = false }
thiserror = "2"
tokio = { version = "1", default-features = false }
unicode-normalization = "0.1"
x509-cert = { version = "0.2.5", default-features = false, features = ["pem"] }
zeroize = { version = "1", default-features = false }

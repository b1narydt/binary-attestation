[workspace]
members = ["rust/core"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/b1narydt/binary-attestation"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22"
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
